services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-vercomfix}
      MYSQL_DATABASE: api_signatures
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_PASSWORD:-vercomfix}"]
      interval: 5s
      retries: 20

  app:
    build: .
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-vercomfix}
      MYSQL_DATABASE: api_signatures
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    ports:
      - "8080:8080"

volumes:
  mysql_data:

